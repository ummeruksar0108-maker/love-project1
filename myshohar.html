<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background: url("mine.jpg") no-repeat center center/cover;
}

/* balanced overlay */
.overlay {
  background: rgba(0,0,0,0.45);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

/* soft glowing text */
h1, #reasons, #finalMsg {
  color:white;
  text-shadow: 0 0 8px rgba(255,255,255,0.6);
}

button {
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4d6d;
  color:white;
  font-size:18px;
  cursor:pointer;
}

#main {
  display:none;
}

#finalMsg {
  display:none;
  font-size:22px;
  margin-top:20px;
}

/* reasons box */
#reasons {
  margin-top:20px;
  max-width:600px;
  text-align:left;
  font-size:18px;
}

/* video */
#video {
  position:fixed;
  bottom:20px;
  right:20px;
  width:200px;
  border-radius:15px;
}

/* soft hearts */
.heart {
  position: fixed;
  width:15px;
  height:15px;
  background:#ff4d6d;
  transform: rotate(45deg);
  animation: float 8s linear infinite;
  opacity:0.7;
}

.heart::before,
.heart::after {
  content:'';
  position:absolute;
  width:15px;
  height:15px;
  background:#ff4d6d;
  border-radius:50%;
}

.heart::before { top:-7px; left:0; }
.heart::after { left:-7px; top:0; }

@keyframes float {
  0% { transform: translateY(100vh) rotate(45deg); opacity:1; }
  100% { transform: translateY(-10vh) rotate(45deg); opacity:0; }
}
</style>
</head>

<body>

<div class="overlay">

<audio id="music" loop>
  <source src="Mera Yaar Bhaag Milkha Bhaag (pagalall.com).mp3">
